name: Unofficial NeoForge build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  neoforge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - name: Build vendored dependencies and mod
        shell: pwsh
        run: ./build-neoforge.ps1
      - name: Run space-station, safety and GC4 restoration regression tests
        shell: pwsh
        run: ./build-neoforge.ps1 -Project Galacticraft -Tasks ':neoforge:runStationTests'
      - name: Package runtime mod without development tests
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: Galacticraft-Unofficial-NeoForge
          path: dist/
