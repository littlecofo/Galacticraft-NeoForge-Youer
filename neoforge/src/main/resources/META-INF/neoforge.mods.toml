modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/littlecofo/Galacticraft-NeoForge-Youer/issues"

[[mods]]
modId = "galacticraft"
version = "${version}"
displayName = "Galacticraft (Unofficial NeoForge / Youer)"
displayURL = "https://github.com/littlecofo/Galacticraft-NeoForge-Youer"
description = '''
Unofficial NeoForge / Youer continuation by littlecofo, based on Colin Vaughn's community fork and Team Galacticraft's 1.21.1 work. Not an official Galacticraft release.
'''
authors = "Team Galacticraft, Colin Vaughn (Boobcat), littlecofo (NeoForge / Youer adaptation)"

[[dependencies.galacticraft]]
modId = "neoforge"
type = "required"
versionRange = "[${neoForgeVersion},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.galacticraft]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraftVersion}]"
ordering = "NONE"
side = "BOTH"

[[dependencies.galacticraft]]
modId = "architectury"
type = "required"
versionRange = "[${architecturyVersion},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.galacticraft]]
modId = "machinelib"
type = "required"
versionRange = "[${machineLibVersion},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.galacticraft]]
modId = "dynamicdimensions"
type = "required"
versionRange = "[${dynamicDimensionsVersion},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.galacticraft]]
modId = "badpackets"
type = "required"
versionRange = "[${badPacketsVersion},)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "galacticraft-neoforge.mixins.json"

[[mixins]]
config = "galacticraft-api-neoforge.mixins.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"
